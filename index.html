<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D0D0C">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./assets/icon-192.png" />
    <title>Aethel Core | Secure Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #08080A;
            --charcoal: #121214;
            --gold-bright: #FFD700;
            --gold-deep: #D4AF37;
            --text-main: #F8F9FA;
            --text-muted: #6c757d;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(18, 18, 20, 0.85);
            --danger: #dc3545;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--obsidian);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Typography */
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.5px; }
        .text-muted { color: var(--text-muted); font-size: 0.9rem; }
        .mb-1 { margin-bottom: 1rem; } .mt-2 { margin-top: 1rem; } .w-100 { width: 100%; }

        /* Glass & Inputs */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
        }
        .glass-input {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            width: 100%;
            font-size: 1rem;
            transition: border 0.2s;
        }
        .glass-input:focus { outline: none; border-color: var(--gold-deep); }

        /* Buttons */
        .btn-gold {
            background: var(--gold-bright);
            color: #000;
            border: none;
            font-weight: 700;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .btn-gold:hover { filter: brightness(1.1); }
        .btn-outline-gold {
            background: transparent;
            color: var(--gold-bright);
            border: 1px solid var(--gold-deep);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-sm {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-sm.danger { border-color: var(--danger); color: var(--danger); }

        /* Auth View */
        .auth-wrapper { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { width: 100%; max-width: 400px; text-align: center; }
        .auth-header h2 { color: var(--gold-bright); margin-bottom: 0.5rem; }
        .auth-form { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }

        /* Dashboard Layout */
        .top-nav {
            background: rgba(8,8,10,0.9);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .nav-brand { font-family: 'Space Grotesk'; font-weight: 700; font-size: 1rem; color: var(--text-muted); }
        .tier-badge { padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; background: rgba(255,215,0,0.1); color: var(--gold-bright); border: 1px solid var(--gold-deep); }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 100px 1.5rem; }
        .page-title { margin-bottom: 0.5rem; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        
        /* Nav Cards */
        .nav-card { cursor: pointer; transition: border 0.2s; }
        .nav-card:hover { border-color: var(--gold-deep); }
        .nav-card h3 { margin-bottom: 0.5rem; }
        .nav-card .link { color: var(--gold-bright); font-size: 0.9rem; font-weight: 600; display: block; margin-top: 1rem; }

        /* Vault View */
        .vault-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .vault-entry strong { display: block; color: var(--text-main); }
        .vault-entry small { color: var(--text-muted); font-size: 0.75rem; }
        .entry-actions { display: flex; gap: 0.5rem; }

        /* Output Box */
        .output-box {
            background: rgba(0,0,0,0.5);
            border: 1px dashed var(--border-subtle);
            border-radius: 8px;
            padding: 1rem;
            min-height: 50px;
            word-break: break-all;
        }

        /* Floating Dock */
        .floating-dock {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(18,18,20,0.95);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 0.5rem;
            display: flex; gap: 0.2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.6rem 1rem; border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .dock-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .dock-item.active { background: rgba(255,215,0,0.1); color: var(--gold-bright); }
        .dock-item span { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .dock-divider { width: 1px; background: var(--border-subtle); margin: 0.5rem 0; }

        /* Modals & Toasts */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 2rem;
        }
        .modal-content { background: var(--charcoal); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 2rem; max-width: 500px; width: 100%; }
        
        .toast {
            position: fixed; bottom: 100px; right: 2rem; background: var(--charcoal);
            border: 1px solid var(--gold-deep); padding: 1rem; border-radius: 8px;
            transform: translateX(150%); transition: transform 0.3s ease; z-index: 10000;
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./legal-text.js"></script>
    <script src="./app.js"></script>
</body>
</html>
