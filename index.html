<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D0D0C">
    <link rel="manifest" href="./manifest.json">
    <title>Aethel Core | Sovereign Web Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0D0D0C;
            --charcoal: #1A1A18;
            --gold-bright: #FFD700;
            --gold-deep: #D4AF37;
            --text-main: #F5F5F5; /* Brightened for visibility */
            --text-muted: #888880;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(26, 26, 24, 0.7);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            background-color: var(--obsidian);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.04) 0%, transparent 20%);
        }

        /* --- AUTH SCREEN (Sleek & Centered) --- */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .auth-card {
            max-width: 440px;
            width: 100%;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            background: rgba(26, 26, 24, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
        }
        .auth-title {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--gold-bright);
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: 2px;
            margin: 0;
        }
        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }
        .auth-form { margin-top: 2.5rem; }
        .auth-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .auth-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main) !important; /* Fixes invisible text */
            border-radius: 8px;
            padding: 1rem;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .auth-input:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: var(--gold-deep);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            outline: none;
        }
        .auth-btn-primary {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
            color: var(--obsidian);
            border: none;
            font-weight: 700;
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }
        .auth-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4); }
        .auth-disclaimer {
            font-size: 0.75rem;
            color: #555;
            text-align: center;
            margin-top: 1.5rem;
            line-height: 1.4;
        }
        .auth-links { text-align: center; margin-top: 1.5rem; }
        .auth-link { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; transition: color 0.2s; }
        .auth-link:hover { color: var(--gold-bright); }

        /* --- DASHBOARD UI --- */
        .aethel-navbar {
            background: rgba(13, 13, 12, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            position: sticky; top: 0; z-index: 1000;
            display: flex; align-items: center;
        }
        .nav-brand { color: var(--gold-bright); font-weight: 800; letter-spacing: 1.5px; font-family: 'Space Grotesk', sans-serif; }
        .tier-badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: rgba(255,255,255,0.1); color: var(--text-muted); text-transform: uppercase; }
        .tier-badge.premium { background: rgba(255, 215, 0, 0.15); color: var(--gold-bright); border: 1px solid var(--gold-deep); }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; border-radius: 6px; background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); cursor: pointer; }
        .btn-sm:hover { border-color: var(--gold-bright); color: var(--gold-bright); }

        .section-title { color: var(--text-main); font-family: 'Space Grotesk', sans-serif; margin-bottom: 1.5rem; font-weight: 700; }
        .aethel-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .card-header-gold { color: var(--gold-bright); font-weight: 700; margin-bottom: 1.2rem; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1.5px; font-family: 'Space Grotesk', sans-serif; }
        .aethel-textarea, .aethel-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main) !important; border-radius: 8px; padding: 0.85rem; width: 100%; }
        .aethel-textarea:focus, .aethel-input:focus { border-color: var(--gold-deep); outline: none; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1); }
        .aethel-output { background: rgba(0,0,0,0.3); border: 1px dashed var(--border-subtle); border-radius: 8px; padding: 0.75rem; font-size: 0.85rem; color: var(--text-muted); word-break: break-all; min-height: 45px; }
        .aethel-card.locked { filter: grayscale(0.8) brightness(0.6); }
        .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 13, 12, 0.8); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        .lock-overlay span { color: var(--gold-bright); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; background: var(--obsidian); padding: 0.5rem 1rem; border: 1px solid var(--gold-bright); border-radius: 4px; margin-top: 1rem; }

        /* --- UTILITIES --- */
        .aethel-glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--obsidian); } ::-webkit-scrollbar-thumb { background: var(--charcoal); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: var(--gold-deep); }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./legal-text.js"></script>
    <script src="./app.js"></script>
</body>
</html>
