<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D0D0C">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./assets/icon-192.png" />
    <title>Aethel Core | Sovereign Web Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0D0D0C;
            --charcoal: #161614;
            --gold-bright: #FFD700;
            --gold-deep: #D4AF37;
            --text-main: #FFFFFF;
            --text-muted: #888880;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(22, 22, 20, 0.75);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            background-color: var(--obsidian);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 20%);
        }

        /* --- AUTH SCREEN --- */
        .auth-wrapper {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem;
        }
        .auth-card {
            max-width: 460px; width: 100%; padding: 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
        }
        .auth-header { text-align: center; margin-bottom: 2.5rem; }
        .auth-header h2 {
            font-family: 'Space Grotesk', sans-serif; color: var(--gold-bright);
            font-weight: 800; font-size: 1.8rem; letter-spacing: 2px; margin: 1rem 0 0.5rem 0;
        }
        .auth-header p { color: var(--text-muted); font-size: 0.9rem; margin: 0; }
        .auth-form label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .auth-pending { text-align: center; padding: 1rem 0; }
        .pending-icon { font-size: 3rem; margin-bottom: 1rem; }
        .auth-pending h3 { color: var(--gold-bright); font-family: 'Space Grotesk', sans-serif; }
        .auth-pending p { color: var(--text-main); font-size: 0.9rem; margin-top: 1rem; }
        .pending-sub { color: var(--text-muted) !important; font-size: 0.8rem !important; }

        /* --- GLOBAL INPUTS & BUTTONS --- */
        .glass-input, .auth-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-subtle);
            color: var(--text-main) !important;
            border-radius: 10px; padding: 1rem; width: 100%; font-size: 1rem;
            transition: all 0.3s ease;
        }
        .glass-input:focus, .auth-input:focus {
            background: rgba(0, 0, 0, 0.8); border-color: var(--gold-deep);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); outline: none;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
            color: var(--obsidian); border: none; font-weight: 700;
            padding: 1rem; border-radius: 10px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15);
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-outline-gold {
            background: transparent; color: var(--gold-bright);
            border: 1px solid var(--gold-deep); font-weight: 600;
            padding: 0.8rem; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
        }
        .btn-outline-gold:hover { background: rgba(255, 215, 0, 0.1); border-color: var(--gold-bright); }
        .w-100 { width: 100%; } .mt-2 { margin-top: 1rem; }
        .auth-disclaimer { font-size: 0.75rem; color: #555; text-align: center; margin-top: 1.5rem; }
        .auth-footer { text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem; }
        .link-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; }
        .link-btn:hover { color: var(--gold-bright); }

        /* --- DASHBOARD --- */
        .top-nav {
            background: rgba(13, 13, 12, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle); padding: 1.2rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-brand { color: var(--gold-bright); font-weight: 800; letter-spacing: 1.5px; font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .tier-badge { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .tier-badge.free { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .tier-badge.pro { background: rgba(255, 215, 0, 0.15); color: var(--gold-bright); border: 1px solid var(--gold-deep); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; border-radius: 6px; background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); cursor: pointer; transition: 0.2s; }
        .btn-sm:hover { border-color: var(--gold-bright); color: var(--gold-bright); }

        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem 150px 2rem; /* Padding bottom for dock */ }
        .section-block { margin-bottom: 4rem; }
        .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem; }
        .section-sub { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; margin-left: 0.5rem; }

        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: var(--glass-bg); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 1.5rem; position: relative;
            transition: all 0.3s ease; backdrop-filter: blur(12px);
        }
        .glass-card:hover { border-color: rgba(255, 215, 0, 0.2); }
        .glass-card.locked { opacity: 0.6; }
        .glass-card.active { border-color: rgba(255, 215, 0, 0.4); box-shadow: 0 0 30px rgba(255, 215, 0, 0.05); }
        .card-header { display: flex; align-items: center; gap: 0.8rem; color: var(--text-main); font-weight: 600; margin-bottom: 1rem; font-family: 'Space Grotesk', sans-serif; }
        
        .pro-badge {
            position: absolute; top: 1rem; right: 1rem; background: var(--gold-bright);
            color: var(--obsidian); font-size: 0.65rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 4px;
        }
        .output-box {
            background: rgba(0,0,0,0.4); border: 1px dashed var(--border-subtle);
            border-radius: 8px; padding: 0.8rem; font-size: 0.85rem; color: var(--text-muted);
            word-break: break-all; min-height: 45px;
        }

        /* --- FLOATING DOCK --- */
        .floating-dock {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(22, 22, 20, 0.85); backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border-subtle); border-radius: 20px;
            padding: 0.8rem; display: flex; align-items: center; gap: 0.5rem;
            z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; padding: 0.5rem 1rem; border-radius: 12px; transition: all 0.2s;
            min-width: 70px;
        }
        .dock-item:hover { background: rgba(255,255,255,0.05); color: var(--gold-bright); transform: translateY(-3px); }
        .dock-item span { font-size: 0.7rem; font-weight: 500; }
        .dock-divider { width: 1px; height: 30px; background: var(--border-subtle); margin: 0 0.5rem; }
        .dock-item.logout:hover { color: #ff4d4d; }

        /* --- MODALS --- */
        .aethel-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .aethel-modal-content {
            max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto;
            background: var(--glass-bg); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 2.5rem; position: relative;
        }
        .modal-close-btn {
            position: absolute; top: 1rem; right: 1rem; background: none; border: none;
            color: var(--gold-bright); font-size: 2rem; cursor: pointer;
        }

        /* --- TOAST --- */
        .aethel-toast {
            position: fixed; bottom: 100px; right: 2rem; background: rgba(22, 22, 20, 0.95);
            backdrop-filter: blur(12px); border: 1px solid var(--gold-deep);
            padding: 1rem 1.5rem; border-radius: 8px; z-index: 10000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .aethel-toast.show { transform: translateX(0); }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--obsidian); }
        ::-webkit-scrollbar-thumb { background: var(--charcoal); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-deep); }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./legal-text.js"></script>
    <script src="./app.js"></script>
</body>
</html>
