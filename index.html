<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F19">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.svg">
    <title>Aethel Core | E2E Encrypted Cyber Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19; --bg-card: #151B2B; --bg-input: #0F1420;
            --border: rgba(255, 255, 255, 0.08); --accent: #00E5A0; --accent-dim: rgba(0, 229, 160, 0.1);
            --danger: #FF4D4D; --warning: #FFB800; --text-main: #FFFFFF; --text-muted: #8B9BB4;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }
        h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.5px; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .text-muted { color: var(--text-muted); font-size: 0.9rem; }
        
        #app-root { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .top-nav { background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; transition: border 0.2s; }
        .card:hover { border-color: rgba(255,255,255,0.15); }
        
        .input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .input { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); border-radius: 10px; padding: 1rem; width: 100%; font-size: 1rem; transition: all 0.2s; }
        .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        textarea.input { min-height: 100px; resize: vertical; }

        .btn { background: var(--accent); color: #000; border: none; font-weight: 700; padding: 1rem 1.5rem; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; white-space: nowrap; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 8px; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        
        .nav-card { cursor: pointer; display: flex; flex-direction: column; gap: 1rem; }
        .nav-card:hover { border-color: var(--accent); background: var(--accent-dim); }

        .scan-results { background: var(--bg-input); border: 1px dashed var(--border); border-radius: 10px; padding: 1rem; margin-top: 1rem; }
        .threat-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: rgba(255,77,77,0.1); border: 1px solid var(--danger); border-radius: 6px; margin-bottom: 0.5rem; color: var(--danger); font-size: 0.9rem; }
        .clear-item { display: flex; align-items: center; gap: 0.5rem; color: var(--accent); font-size: 0.9rem; }
        
        .progress-bar { height: 6px; background: var(--bg-input); border-radius: 3px; overflow: hidden; margin: 1rem 0; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

        .dock { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: rgba(21, 27, 43, 0.9); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 0.5rem; display: flex; gap: 0.25rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 1000; max-width: calc(100% - 2rem); overflow-x: auto; }
        .dock-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; background: transparent; border: none; color: var(--text-muted); padding: 0.6rem 0.8rem; border-radius: 12px; cursor: pointer; transition: all 0.2s; min-width: 60px; }
        .dock-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .dock-item.active { background: var(--accent-dim); color: var(--accent); }
        .dock-item span { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        
        .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 3rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-dim); }
        
        .toast { position: fixed; top: 2rem; right: 2rem; background: var(--bg-card); border: 1px solid var(--accent); padding: 1rem; border-radius: 8px; z-index: 9999; transform: translateX(150%); transition: transform 0.3s; }
        .toast.show { transform: translateX(0); }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .tab { padding: 0.8rem 1.2rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .media-player { width: 100%; border-radius: 12px; margin-bottom: 1rem; background: #000; }
        .speed-controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
        
        .key-box { background: #000; border: 1px solid var(--warning); color: var(--warning); padding: 1rem; border-radius: 8px; word-break: break-all; font-family: 'JetBrains Mono', monospace; margin: 1rem 0; }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <div id="toast-container"></div>
    
    <!-- Real File Processing Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <script src="./legal-text.js"></script>
    <script src="./app.js"></script>
</body>
</html>
