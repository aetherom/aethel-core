<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#080A12" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A0" />
      <stop offset="100%" stop-color="#00B8FF" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00E5A0" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Hexagon Vault Frame (Local Environment) -->
  <path d="M256 70 L410 160 L410 352 L256 442 L102 352 L102 160 Z" fill="none" stroke="#1A2033" stroke-width="12" />
  <path d="M256 90 L390 168 L390 344 L256 422 L122 344 L122 168 Z" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="15, 10" opacity="0.5" />

  <!-- Abstract 'A' (Left & Right Legs) -->
  <path d="M160 390 L230 140" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" filter="url(#neon)" />
  <path d="M230 140 L300 390" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" filter="url(#neon)" />
  
  <!-- Encrypted Data Stream Crossbar -->
  <rect x="185" y="280" width="105" height="22" rx="11" fill="url(#glow)" filter="url(#neon)" />
  <circle cx="205" cy="291" r="6" fill="#0B0F19" />
  <circle cx="237" cy="291" r="6" fill="#0B0F19" />
  <circle cx="269" cy="291" r="6" fill="#0B0F19" />

  <!-- Sovereign Key Node (Top of A) -->
  <circle cx="230" cy="140" r="34" fill="#0B0F19" stroke="url(#glow)" stroke-width="8" filter="url(#neon)"/>
  <path d="M230 130 L230 150 M220 150 L240 150" stroke="#00E5A0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="230" cy="140" r="7" fill="#00E5A0" />
</svg>