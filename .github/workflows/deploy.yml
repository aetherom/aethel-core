name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Aethel Core
    steps:
      - uses: actions/checkout@v3
      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.1.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN Will be Added Soon }}
          accountId: ${{ secrets.898fd674a8b7d0b792dd1cbaba7f6456}}
